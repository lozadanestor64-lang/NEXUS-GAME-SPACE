name: Descomprimir proyecto

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reemplazar el proyecto por el zip más reciente
        run: |
          ZIP=$(ls *.zip | sort -V | tail -n 1)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Usando: $ZIP"
          rm -rf /tmp/proyecto
          mkdir /tmp/proyecto
          unzip -q "$ZIP" -d /tmp/proyecto
          DIR=$(dirname "$(find /tmp/proyecto -name settings.gradle.kts | head -n 1)")
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='*.zip' "$DIR"/ ./
          git rm -q --ignore-unmatch *.zip

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Reemplazar proyecto con $ZIP" || echo "Sin cambios"
          git push

      - name: Lanzar compilación
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run android.yml --ref ${{ github.ref_name }}
